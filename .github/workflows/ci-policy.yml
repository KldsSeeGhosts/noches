name: CI policy

on:
  pull_request:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/**'
      - 'scripts/ci/**'
      - 'scripts/*release*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-policy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install workflow test dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/ci/requirements.txt
      - name: Release and CI contract regressions
        run: |
          python3 scripts/test-noches-release.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Lint workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
