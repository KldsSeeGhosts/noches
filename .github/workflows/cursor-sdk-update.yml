name: Cursor SDK update check
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cursor-sdk-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check stable SDK version
        run: python3 scripts/update-cursor-sdk.py
      - name: Record proposed update without creating a branch
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git diff -- crates/harness/src/cursor/mod.rs > "$RUNNER_TEMP/cursor-sdk-update.patch"
          echo 'A newer SDK is available. Apply the patch on dev and run Cursor compatibility before promotion to main.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: cursor-sdk-proposed-update
          path: ${{ runner.temp }}/cursor-sdk-update.patch
          if-no-files-found: ignore
