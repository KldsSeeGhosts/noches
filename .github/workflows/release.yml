name: Noches releases

on:
  # Main protection requires the historical validation/... check names.
  # Dev/feature PRs use ui-tests.yml directly, never a second copy here.
  pull_request:
    branches: [main]
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      migration:
        description: 'One-time migration phase (dev branch only); normal is ordinary release'
        type: choice
        options: [normal, seed, bridge]
        required: true
        default: normal
      channel:
        description: 'Migration channel (normal uses auto)'
        type: choice
        options: [auto, dev, stable]
        default: auto
      confirm:
        description: 'For migration type exactly seed-dev, seed-stable, bridge-dev, or bridge-stable'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ui-tests.yml
    with:
      skip-compatibility: true
    permissions:
      contents: read
      pull-requests: read

  compatibility:
    uses: ./.github/workflows/cursor-compatibility.yml

  edge-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: edge/package-lock.json
      - run: npm ci --prefix edge
      - run: npm --prefix edge run typecheck
      - run: npm --prefix edge test

  prepare:
    if: github.repository_owner == 'KldsSeeGhosts' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/dev') && (github.event_name != 'workflow_dispatch' || (inputs.migration == 'normal' && inputs.channel == 'auto' && inputs.confirm == '' || github.ref == 'refs/heads/dev' && inputs.migration != 'normal' && inputs.channel != '' && inputs.confirm == format('{0}-{1}', inputs.migration, inputs.channel)))
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      version: ${{ steps.identity.outputs.version }}
      build_attempt: ${{ steps.identity.outputs.build_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: identity
        env:
          NOCHES_SOURCE_BRANCH: ${{ github.base_ref || github.ref_name }}
          NOCHES_RELEASE_MODE: ${{ inputs.migration || 'normal' }}
          NOCHES_MIGRATION_CHANNEL: ${{ inputs.migration != 'normal' && inputs.channel || '' }}
        run: python3 scripts/noches-release.py prepare
      - name: Release configuration tests
        run: python3 scripts/test-noches-release.py

  linux:
    if: github.event_name != 'pull_request'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # Cancel obsolete dev builds, never interrupt a publisher or stable release.
    concurrency:
      group: noches-linux-${{ github.event_name }}-${{ github.ref }}-${{ matrix.runner }}-${{ inputs.migration || 'normal' }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: System dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake ninja-build libnss3 libatk-bridge2.0-0 libgtk-3-0
      - name: rust toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Updater tests
        run: cargo test --locked -p zeron-update
      - name: Linux input-seat tests
        run: cargo test --locked -p gpui_linux --lib
      - name: Drop stale packaged artifacts
        run: rm -rf target/package
      - name: Package
        env:
          NOCHES_CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOCHES_VERSION: ${{ needs.prepare.outputs.version }}
          NOCHES_REPOSITORY: ${{ github.repository }}
          NOCHES_COMMIT: ${{ github.sha }}
          NOCHES_BRIDGE_EPOCH: ${{ inputs.migration == 'bridge' && '0' || '' }}
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ runner.arch }}
          path: target/package/noches-*.tar.gz
          if-no-files-found: error

  macos:
    if: github.event_name != 'pull_request'
    needs: prepare
    runs-on: macos-15
    concurrency:
      group: noches-macos-${{ github.event_name }}-${{ github.ref }}-${{ inputs.migration || 'normal' }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      AC_API_KEY_P8: ${{ secrets.AC_API_KEY_P8 }}
      AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
      AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/dev' }}
      - name: Updater tests
        run: cargo test --locked -p zeron-update
      - name: Chromium build dependencies
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: import Developer ID certificate
        if: env.MACOS_CERT_P12 != ''
        run: |
          keychain="$RUNNER_TEMP/release.keychain-db"
          pass="$(openssl rand -hex 16)"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Allow codesign to use the imported key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$pass" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | sed -n 's/.*"\(Developer ID Application: [^"]*\)".*/\1/p' | head -1)"
          [ -n "$identity" ] || { echo "p12 contains no Developer ID Application identity"; exit 1; }
          echo "CODESIGN_IDENTITY=$identity" >>"$GITHUB_ENV"
      - name: notary credentials
        if: env.AC_API_KEY_P8 != ''
        run: |
          printf '%s' "$AC_API_KEY_P8" >"$RUNNER_TEMP/ac_api_key.p8"
          {
            echo "NOTARY_KEY_PATH=$RUNNER_TEMP/ac_api_key.p8"
            echo "NOTARY_KEY_ID=$AC_API_KEY_ID"
            echo "NOTARY_ISSUER_ID=$AC_API_ISSUER_ID"
          } >>"$GITHUB_ENV"
      - name: Drop stale packaged artifacts
        run: rm -rf target/package
      - name: Package macOS application
        env:
          NOCHES_CHANNEL: ${{ needs.prepare.outputs.channel }}
          NOCHES_VERSION: ${{ needs.prepare.outputs.version }}
          NOCHES_REPOSITORY: ${{ github.repository }}
          NOCHES_COMMIT: ${{ github.sha }}
          NOCHES_BRIDGE_EPOCH: ${{ inputs.migration == 'bridge' && '0' || '' }}
        run: bash scripts/package-macos.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ runner.arch }}
          path: |
            target/package/noches-*.dmg
            target/package/noches-*.tar.gz
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    # Mobile tests gate TestFlight, not independently published desktop builds.
    needs: [prepare, linux, macos, validation, compatibility, edge-validation]
    # Builds may run concurrently, but only one job may advance a channel feed.
    concurrency:
      group: noches-release-publish-${{ needs.prepare.outputs.channel }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NOCHES_CHANNEL: ${{ needs.prepare.outputs.channel }}
      NOCHES_VERSION: ${{ needs.prepare.outputs.version }}
      NOCHES_BUILD_ATTEMPT: ${{ needs.prepare.outputs.build_attempt }}
      NOCHES_RELEASE_MODE: ${{ inputs.migration || 'normal' }}
      NOCHES_MIGRATION_CONFIRM: ${{ inputs.confirm || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish version and channel manifest
        run: python3 scripts/noches-release.py publish
