name: UI tests

on:
  pull_request:
    # Main's protected check names are emitted by the release caller instead.
    branches-ignore: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'scripts/test-linux-browser.sh'
      - 'scripts/build-chromium.sh'
      - 'scripts/test-chromium-runtime.py'
      - 'dist/browser/**'
      - 'scripts/run-macos-browser-fixture.sh'
      - 'dist/macos/Info.plist'
      - 'apps/ios/**'
      - 'apps/zeron/**'
      - 'scripts/*release*'
      - 'scripts/package-*.sh'
      - 'scripts/install-linux.sh'
      - '.github/workflows/release.yml'
      - '.github/workflows/ui-tests.yml'
      - '.github/workflows/cursor-*.yml'
      - 'scripts/*cursor-sdk*'
      - 'scripts/ci/**'
      - 'vendor/**'
  # Push validation is owned by release.yml, which calls this workflow once.
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-compatibility:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # iOS has an independent workflow. Desktop release commits always run the
  # full desktop matrix; mobile-only PRs do not allocate desktop runners.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      native: ${{ steps.filter.outputs.native }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: filter
        with:
          script: |
            const all = () => {
              core.setOutput('native', 'true');
              core.setOutput('ios', String(context.eventName === 'pull_request'
                && context.payload.pull_request.base.ref === 'main'));
            };
            if (context.eventName !== 'pull_request') return all();
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            // Run everything if the API did not return the full diff.
            if (files.length < context.payload.pull_request.changed_files) return all();
            const paths = files.flatMap(f => [f.filename, f.previous_filename]).filter(Boolean);
            const ios = p => p.startsWith('apps/ios/');
            core.setOutput('native', String(paths.some(p => !ios(p))));
            // Only main PRs need the historical protected iOS check here.
            // Other mobile PRs/pushes have an independent iOS workflow.
            const mobileWorkflow = p => ['.github/workflows/ios-tests.yml',
              '.github/workflows/testflight.yml', '.github/workflows/ui-tests.yml'].includes(p)
              || p.startsWith('.github/actions/ios-tests/');
            core.setOutput('ios', String(context.payload.pull_request.base.ref === 'main'
              && paths.some(p => ios(p) || mobileWorkflow(p))));

  compatibility:
    needs: changes
    if: needs.changes.outputs.native == 'true' && !inputs.skip-compatibility
    uses: ./.github/workflows/cursor-compatibility.yml

  session-sync-regressions:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-session-sync-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    # Cold debug builds plus the full engine/restart matrix exceed 20 minutes.
    # Keep a bounded budget without cancelling healthy validation mid-suite.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # GitHub scopes PR caches to refs/pull/N/merge: they warm retries
          # without being restored by protected-branch release builds.
          shared-key: linux-debug
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Unified build and durable session regressions
        run: python3 scripts/ci/run-session-sync.py

  ui-tests:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-ui-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 30
    env:
      # Test binaries never ship, so skip the release profile's cross-crate
      # LTO: it re-optimizes every dependency at each test binary's link.
      # Debug jobs omit this; rust-cache keys include CARGO_* variables.
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: GPUI system dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Shares dependencies with linux-browser, which saves them.
          shared-key: linux-gpui
          save-if: false
      - name: UI and headless layout regressions
        run: cargo test --release --locked -p zeron-ui --lib

  app-tests:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-app-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: GPUI system dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev \
            libfontconfig1-dev libfreetype-dev libasound2-dev \
            libvulkan-dev pkg-config cmake libwebkit2gtk-4.1-dev libjson-glib-dev
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Application and updater tests
        run: cargo test --release --locked -p zeron -p zeron-update

  macos-ui:
    # Run the desktop-sensitive suite on isolated GitHub-hosted Macs.
    # Fork PRs skip these longer native integration jobs.
    needs: changes
    if: needs.changes.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    concurrency:
      group: ci-macos-ui-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          # Shares dependencies with macos-browser, which saves them.
          shared-key: macos-gpui
          save-if: false
      - name: Check macOS application
        run: cargo check --release --locked -p zeron
      - name: Native diff font geometry regression
        run: cargo test --release --locked -p zeron-ui --lib native_diff_font_geometry -- --test-threads=1
      - name: Native notification click regressions
        run: |
          cargo test --release --locked -p zeron-ui --lib notify::tests:: -- --test-threads=1

  macos-browser:
    needs: changes
    if: needs.changes.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    concurrency:
      group: ci-macos-browser-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 45
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          shared-key: macos-gpui
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Build native browser fixture
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --example preview-fixture --features browser-fixture,webkit-browser
      - name: Native browser regression and screenshots
        timeout-minutes: 3
        env:
          RUST_BACKTRACE: 1
        run: |
          bash scripts/run-macos-browser-fixture.sh target/release/examples/browser-fixture "$RUNNER_TEMP/browser-captures"
          test -f "$RUNNER_TEMP/browser-captures/result.txt"
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-macos-captures
          path: ${{ runner.temp }}/browser-captures
          if-no-files-found: ignore
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Install preview fixture server
        run: npm ci --prefix edge
      - name: Project discovery, stable URLs and HMR in native WebKit
        timeout-minutes: 3
        env:
          ZERON_PREVIEW_AUTO_OPEN: 1
        run: |
          VITE_BINARY="$GITHUB_WORKSPACE/edge/node_modules/vite/bin/vite.js" bash scripts/run-macos-browser-fixture.sh target/release/examples/preview-fixture "$RUNNER_TEMP/preview-captures"
          test -f "$RUNNER_TEMP/preview-captures/result.txt"
      - name: Upload preview screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-macos-captures
          path: ${{ runner.temp }}/preview-captures
          if-no-files-found: ignore

  macos-frame-recovery:
    needs: changes
    if: needs.changes.outputs.native == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    concurrency:
      group: ci-macos-frame-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Check out pinned GPUI for native frame-source tests
        shell: bash
        run: |
          # Avoid tomllib (3.11+) so the runner's Python version does not matter.
          rev=$(python3 -c 'import re,sys; t=open("Cargo.toml").read(); m=re.search(r"(?m)^gpui\s*=\s*\{[^}]*\brev\s*=\s*\"([0-9a-f]+)\"", t); sys.exit("could not parse gpui rev from Cargo.toml") if not m else print(m.group(1))')
          git init frame-source-tests
          git -C frame-source-tests remote add origin https://github.com/zeronsh/zui
          git -C frame-source-tests fetch --depth=1 origin "$rev"
          git -C frame-source-tests checkout --detach FETCH_HEAD
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          workspaces: frame-source-tests
      - name: Native frame-source recovery regression
        working-directory: frame-source-tests
        run: cargo test --release --locked -p gpui_macos --test frame_source_recovery

  # Preserve main's required `validation / ios-tests` check without coupling
  # mobile tests to post-merge desktop publishing or duplicating their steps.
  ios-tests:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/ios-tests

  linux-browser:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    concurrency:
      group: ci-linux-browser-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Native browser and GPUI dependencies
        run: |
          # Only Ubuntu packages are needed; unrelated runner repositories can be out of sync.
          sudo apt-get update -qq -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" -o Dir::Etc::sourceparts="-"
          sudo apt-get install -y -qq \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev \
            libfreetype-dev libasound2-dev libvulkan-dev pkg-config cmake \
            libwebkit2gtk-4.1-dev libjson-glib-dev xvfb xdotool openbox \
            weston ffmpeg imagemagick fonts-noto-cjk
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          shared-key: linux-gpui
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Build browser fixture
        run: cargo build --release --locked -p zeron-ui --example browser-fixture --features browser-fixture,webkit-browser
      - name: X11 and Wayland browser regressions
        timeout-minutes: 5
        env:
          RUST_LOG: gpui_wgpu=info
        run: |
          scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/default"
          VK_DRIVER_FILES=/dev/null scripts/test-linux-browser.sh "$RUNNER_TEMP/linux-browser/opengl"
      - name: Upload native browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-browser
          path: ${{ runner.temp }}/linux-browser
          if-no-files-found: warn

  chromium-browser:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ci-chromium-${{ matrix.os }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-dev libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev libasound2-dev libvulkan-dev mesa-vulkan-drivers libnss3 libatk-bridge2.0-0 libgtk-3-0 pkg-config cmake ninja-build xvfb xdotool imagemagick
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew list cmake ninja >/dev/null 2>&1 || brew install cmake ninja
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false
          cache-on-failure: true
          save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      - name: Build Chromium and shared-page fixture
        run: |
          scripts/build-chromium.sh "$RUNNER_TEMP/chromium" debug
          cargo test --locked -p zeron-browser
          cargo build --locked -p zeron-ui --example chromium-fixture --features browser-fixture
      - name: macOS browser checks
        if: runner.os == 'macOS'
        run: |
          export NOCHES_CHROMIUM_HELPER="$RUNNER_TEMP/chromium/Noches Browser.app/Contents/MacOS/noches-chromium"
          codesign --force --deep --sign - "$RUNNER_TEMP/chromium/Noches Browser.app"
          python3 scripts/test-chromium-runtime.py "$NOCHES_CHROMIUM_HELPER" "$RUNNER_TEMP/chromium-results/runtime"
          bash scripts/run-macos-browser-fixture.sh target/debug/examples/chromium-fixture "$RUNNER_TEMP/chromium-results/gpui"
      - name: Linux browser checks
        if: runner.os == 'Linux'
        run: |
          export NOCHES_CHROMIUM_HELPER="$RUNNER_TEMP/chromium/browser/noches-chromium"
          # Ubuntu 24.04 restricts user namespaces to named AppArmor profiles.
          # Grant this CI binary userns access while retaining Chromium's sandbox.
          printf 'abi <abi/4.0>,\nprofile noches-ci-browser %s flags=(unconfined) { userns, }\n' "$NOCHES_CHROMIUM_HELPER" | sudo tee /etc/apparmor.d/noches-ci-browser >/dev/null
          sudo apparmor_parser -r /etc/apparmor.d/noches-ci-browser
          xvfb-run -a python3 scripts/test-chromium-runtime.py "$NOCHES_CHROMIUM_HELPER" "$RUNNER_TEMP/chromium-results/runtime"
          xvfb-run -a target/debug/examples/chromium-fixture "$RUNNER_TEMP/chromium-results/gpui"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: chromium-${{ runner.os }}
          path: ${{ runner.temp }}/chromium-results
          if-no-files-found: warn
